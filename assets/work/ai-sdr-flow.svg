<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">AI SDR system flow</title>
  <desc id="d">Diagram: lead sources, including Clay enrichment, feed an AI qualification step run by Claude and orchestrated with n8n; qualified leads are written to the HubSpot CRM.</desc>
  <!-- Same visual language as the home hero: navy ground, chrome gradient,
       right-angle circuit traces into ringed nodes. Colours are hardcoded
       because this file is loaded through <img>, where the site CSS does not
       reach. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#8894a8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#5c677a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#171c28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8797"/>
      <stop offset="46%" stop-color="#eef1f5"/>
      <stop offset="78%" stop-color="#9aa5b4"/>
      <stop offset="100%" stop-color="#7c8797"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252d41"/>
      <stop offset="100%" stop-color="#1a2031"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="#171c28"/>
  <circle cx="320" cy="226" r="210" fill="url(#glow)"/>
  <circle cx="320" cy="226" r="150" fill="none" stroke="#262e42"/>

  <!-- blueprint rules -->
  <g stroke="#343c50" fill="none">
    <path d="M20 30 V70 M20 30 H60"/>
    <path d="M620 450 V410 M620 450 H580"/>
  </g>

  <g font-family="Space Grotesk, Segoe UI, system-ui, sans-serif">
    <!-- stage labels -->
    <g font-size="11" fill="#b7c0cc" letter-spacing="1.2">
      <text x="40" y="104">01 · SOURCES</text>
      <text x="252" y="144">02 · QUALIFY</text>
      <text x="450" y="104">03 · CRM</text>
    </g>

    <!-- circuit traces -->
    <g fill="none" stroke="#7f8b9d" stroke-width="1.6" stroke-linecap="square">
      <path d="M190 146 H220 V208 H252"/>
      <path d="M190 226 H252"/>
      <path d="M190 306 H220 V244 H252"/>
      <path d="M388 226 H420 V160 H450"/>
      <path d="M320 296 V340"/>
    </g>

    <!-- 01 lead sources -->
    <g>
      <rect x="40" y="120" width="150" height="52" rx="4" fill="url(#panel)" stroke="#343c50"/>
      <text x="56" y="151" font-size="14" fill="#eef1f5">Target lists</text>
      <rect x="40" y="200" width="150" height="52" rx="4" fill="url(#panel)" stroke="#343c50"/>
      <text x="56" y="231" font-size="14" fill="#eef1f5">Intent signals</text>
      <rect x="40" y="280" width="150" height="52" rx="4" fill="url(#panel)" stroke="#343c50"/>
      <text x="56" y="311" font-size="14" fill="#eef1f5">Clay enrichment</text>
    </g>

    <!-- 02 AI qualification chip -->
    <g stroke="#626d7f" stroke-width="1.4">
      <path d="M280 156 V146 M306 156 V146 M334 156 V146 M360 156 V146"/>
      <path d="M280 296 V306 M306 296 V306 M334 296 V306 M360 296 V306"/>
    </g>
    <rect x="252" y="156" width="136" height="140" rx="6" fill="#1e2437" stroke="url(#chrome)" stroke-width="1.8"/>
    <rect x="262" y="166" width="116" height="120" rx="3" fill="none" stroke="#343c50"/>
    <text x="320" y="206" font-size="12" fill="#b7c0cc" text-anchor="middle">AI qualification</text>
    <text x="320" y="236" font-size="24" font-weight="600" fill="url(#chrome)" text-anchor="middle">Claude</text>
    <text x="320" y="262" font-size="11" fill="#b7c0cc" text-anchor="middle">fit · intent · timing</text>

    <!-- orchestration bar -->
    <rect x="200" y="340" width="240" height="40" rx="4" fill="#171c28" stroke="#626d7f" stroke-dasharray="4 4"/>
    <text x="320" y="365" font-size="13" fill="#eef1f5" text-anchor="middle">Orchestrated with n8n</text>

    <!-- 03 CRM -->
    <rect x="450" y="120" width="150" height="212" rx="4" fill="url(#panel)" stroke="#343c50"/>
    <text x="466" y="148" font-size="14" fill="#eef1f5">HubSpot</text>
    <path d="M450 162 H600" stroke="#343c50"/>
    <g fill="#626d7f">
      <rect x="484" y="180" width="80" height="6" rx="3" fill="#b7c0cc"/>
      <rect x="484" y="192" width="54" height="5" rx="2.5"/>
      <rect x="484" y="220" width="72" height="6" rx="3" fill="#b7c0cc"/>
      <rect x="484" y="232" width="60" height="5" rx="2.5"/>
      <rect x="484" y="260" width="84" height="6" rx="3" fill="#b7c0cc"/>
      <rect x="484" y="272" width="46" height="5" rx="2.5"/>
    </g>
    <g fill="#eef1f5">
      <circle cx="469" cy="188" r="4"/>
      <circle cx="469" cy="228" r="4"/>
      <circle cx="469" cy="268" r="4"/>
    </g>
    <text x="466" y="316" font-size="11" fill="#b7c0cc" letter-spacing="0.6">Qualified leads</text>
  </g>

  <!-- ringed nodes: filled with the ground colour so traces tuck behind -->
  <g fill="#171c28" stroke="#b7c0cc" stroke-width="1.6">
    <circle cx="190" cy="146" r="5"/>
    <circle cx="190" cy="226" r="5"/>
    <circle cx="190" cy="306" r="5"/>
    <circle cx="420" cy="193" r="5"/>
    <circle cx="450" cy="160" r="5"/>
    <circle cx="320" cy="320" r="4.5"/>
  </g>

  <!-- signal network, echoing the hero's lower corner -->
  <g stroke="#626d7f" stroke-width="0.9">
    <line x1="40" y1="438" x2="96" y2="420"/>
    <line x1="96" y1="420" x2="150" y2="444"/>
    <line x1="150" y1="444" x2="206" y2="424"/>
    <line x1="96" y1="420" x2="206" y2="424"/>
  </g>
  <g fill="#eef1f5">
    <circle cx="40" cy="438" r="3"/>
    <circle cx="96" cy="420" r="3.5"/>
    <circle cx="150" cy="444" r="3" opacity="0.6"/>
    <circle cx="206" cy="424" r="3.5"/>
  </g>
</svg>
