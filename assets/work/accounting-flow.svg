<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d">
  <title id="t">Accounting workflow automation flow</title>
  <desc id="d">Diagram: an incoming invoice is read by Claude CoWork, which writes the entry to a Google Sheets ledger automatically and then sends a Slack notification.</desc>
  <!-- Same visual language as the home hero. Colours are hardcoded because
       this file is loaded through <img>, where the site CSS does not reach. -->
  <defs>
    <radialGradient id="glow" cx="48%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#8894a8" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#5c677a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#171c28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c8797"/>
      <stop offset="46%" stop-color="#eef1f5"/>
      <stop offset="78%" stop-color="#9aa5b4"/>
      <stop offset="100%" stop-color="#7c8797"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#252d41"/>
      <stop offset="100%" stop-color="#1a2031"/>
    </linearGradient>
  </defs>

  <rect width="640" height="480" fill="#171c28"/>
  <circle cx="305" cy="220" r="210" fill="url(#glow)"/>
  <circle cx="305" cy="220" r="150" fill="none" stroke="#262e42"/>

  <g stroke="#343c50" fill="none">
    <path d="M20 30 V70 M20 30 H60"/>
    <path d="M620 450 V410 M620 450 H580"/>
  </g>

  <g font-family="Space Grotesk, Segoe UI, system-ui, sans-serif">
    <g font-size="11" fill="#b7c0cc" letter-spacing="1.2">
      <text x="40" y="94">01 · INVOICE IN</text>
      <text x="240" y="134">02 · AUTO ENTRY</text>
      <text x="420" y="84">03 · LEDGER</text>
      <text x="420" y="300">04 · NOTIFY</text>
    </g>

    <!-- circuit traces -->
    <g fill="none" stroke="#7f8b9d" stroke-width="1.6" stroke-linecap="square">
      <path d="M180 210 H240"/>
      <path d="M370 210 H396 V192 H420"/>
      <path d="M560 232 V270 H540 V312"/>
    </g>

    <!-- 01 invoice document -->
    <path d="M40 110 H156 L180 134 V310 H40 Z" fill="url(#panel)" stroke="#626d7f"/>
    <path d="M156 110 V134 H180" fill="none" stroke="#626d7f"/>
    <text x="56" y="140" font-size="13" font-weight="600" fill="#eef1f5" letter-spacing="1.5">INVOICE</text>
    <g fill="#626d7f">
      <rect x="56" y="156" width="64" height="5" rx="2.5"/>
      <rect x="56" y="168" width="44" height="5" rx="2.5"/>
      <rect x="56" y="196" width="72" height="5" rx="2.5"/>
      <rect x="140" y="196" width="24" height="5" rx="2.5"/>
      <rect x="56" y="212" width="60" height="5" rx="2.5"/>
      <rect x="140" y="212" width="24" height="5" rx="2.5"/>
      <rect x="56" y="228" width="68" height="5" rx="2.5"/>
      <rect x="140" y="228" width="24" height="5" rx="2.5"/>
    </g>
    <path d="M56 252 H164" stroke="#343c50"/>
    <text x="56" y="276" font-size="11" fill="#b7c0cc">Total</text>
    <rect x="128" y="268" width="36" height="8" rx="3" fill="#eef1f5"/>

    <!-- 02 automatic entry chip -->
    <g stroke="#626d7f" stroke-width="1.4">
      <path d="M268 150 V140 M296 150 V140 M322 150 V140 M348 150 V140"/>
      <path d="M268 270 V280 M296 270 V280 M322 270 V280 M348 270 V280"/>
    </g>
    <rect x="240" y="150" width="130" height="120" rx="6" fill="#1e2437" stroke="url(#chrome)" stroke-width="1.8"/>
    <rect x="250" y="160" width="110" height="100" rx="3" fill="none" stroke="#343c50"/>
    <text x="305" y="196" font-size="12" fill="#b7c0cc" text-anchor="middle">Reads &amp; enters</text>
    <text x="305" y="222" font-size="17" font-weight="600" fill="url(#chrome)" text-anchor="middle">Claude</text>
    <text x="305" y="242" font-size="17" font-weight="600" fill="url(#chrome)" text-anchor="middle">CoWork</text>

    <!-- 03 ledger sheet -->
    <rect x="420" y="100" width="180" height="132" rx="4" fill="url(#panel)" stroke="#343c50"/>
    <text x="434" y="124" font-size="13" fill="#eef1f5">Google Sheets</text>
    <g stroke="#343c50">
      <path d="M420 136 H600 M420 154 H600 M420 172 H600 M420 210 H600"/>
      <path d="M466 136 V232 M526 136 V232 M566 136 V232"/>
    </g>
    <g fill="#626d7f">
      <rect x="430" y="142" width="26" height="5" rx="2.5"/>
      <rect x="474" y="142" width="40" height="5" rx="2.5"/>
      <rect x="534" y="142" width="24" height="5" rx="2.5"/>
      <rect x="430" y="160" width="26" height="5" rx="2.5"/>
      <rect x="474" y="160" width="34" height="5" rx="2.5"/>
      <rect x="534" y="160" width="24" height="5" rx="2.5"/>
      <rect x="430" y="178" width="26" height="5" rx="2.5"/>
      <rect x="474" y="178" width="44" height="5" rx="2.5"/>
      <rect x="534" y="178" width="24" height="5" rx="2.5"/>
    </g>
    <!-- the new row -->
    <rect x="421" y="186" width="178" height="22" fill="#2c354b" stroke="url(#chrome)" stroke-width="1.4"/>
    <g fill="#eef1f5">
      <rect x="430" y="194" width="26" height="6" rx="3"/>
      <rect x="474" y="194" width="40" height="6" rx="3"/>
      <rect x="534" y="194" width="24" height="6" rx="3"/>
    </g>
    <text x="578" y="201" font-size="10" fill="#eef1f5" text-anchor="middle">new</text>

    <!-- 04 notification -->
    <rect x="420" y="312" width="180" height="76" rx="6" fill="url(#panel)" stroke="#626d7f"/>
    <circle cx="446" cy="340" r="12" fill="#171c28" stroke="url(#chrome)" stroke-width="1.4"/>
    <path d="M441 344 H451 M442 344 V339 a4 4 0 0 1 8 0 V344 M445 347 H447" fill="none" stroke="#eef1f5" stroke-width="1.4" stroke-linecap="round"/>
    <text x="466" y="338" font-size="13" fill="#eef1f5">Slack notification</text>
    <rect x="466" y="348" width="100" height="5" rx="2.5" fill="#626d7f"/>
    <rect x="436" y="366" width="130" height="5" rx="2.5" fill="#626d7f"/>
  </g>

  <g fill="#171c28" stroke="#b7c0cc" stroke-width="1.6">
    <circle cx="180" cy="210" r="5"/>
    <circle cx="396" cy="201" r="5"/>
    <circle cx="560" cy="232" r="4.5"/>
    <circle cx="540" cy="312" r="5"/>
  </g>

  <g stroke="#626d7f" stroke-width="0.9">
    <line x1="40" y1="438" x2="96" y2="420"/>
    <line x1="96" y1="420" x2="150" y2="444"/>
    <line x1="150" y1="444" x2="206" y2="424"/>
    <line x1="96" y1="420" x2="206" y2="424"/>
  </g>
  <g fill="#eef1f5">
    <circle cx="40" cy="438" r="3"/>
    <circle cx="96" cy="420" r="3.5"/>
    <circle cx="150" cy="444" r="3" opacity="0.6"/>
    <circle cx="206" cy="424" r="3.5"/>
  </g>
</svg>
